# Jupyter Book config for the project website (GitHub Pages).
# Built by .github/workflows/pages.yml:  make site  ->  site/_build/html
title: Reading a drought from space
author: Fabian Löw
copyright: "2026"
only_build_toc_files: true

execute:
  execute_notebooks: "off"      # the committed walkthrough already carries its synthetic outputs

repository:
  url: https://github.com/floew2/drought-from-space-switzerland
  branch: main

html:
  use_repository_button: true
  use_issues_button: false
  home_page_in_navbar: true

parse:
  myst_enable_extensions: [dollarmath, colon_fence]

sphinx:
  extra_extensions: [sphinxcontrib.mermaid]
  config:
    html_show_copyright: true
    suppress_warnings: ["myst.header"]
    myst_heading_anchors: 4            # GitHub-style anchors, so the same links work on GitHub and here
    myst_fence_as_directive: [mermaid] # ```mermaid blocks render as diagrams, as on GitHub
