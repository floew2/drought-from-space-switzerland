name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      # The demo checks itself: calibrated targets, the PSF area invariant and
      # the response model must all hold, or it exits non-zero.
      - name: Demo on synthetic data
        run: make demo
      # The committed walkthrough must still run on the current code.
      - name: Walkthrough notebook runs
        run: |
          python -m pip install nbclient ipykernel
          drought notebook --check
      - name: Upload demo figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-output-py${{ matrix.python-version }}
          path: output/synthetic/
