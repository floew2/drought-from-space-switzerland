[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drought-from-space"
version = "0.1.0"
description = "Reading the 2026 Swiss grassland drought from Sentinel-2 and MeteoSwiss station data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabian Löw" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "pillow>=10",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.7",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebook = ["jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Errors and likely bugs. Style beyond that is not enforced on code that was
# written as an analysis and is being refactored module by module.
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # long lines: string-heavy figure code, wrapped by hand
    "E701",   # `if x: y` on one line, used deliberately in figure code
    "E702",   # `a; b` on one line, same
    "B905",   # zip() without strict= — the iterables are equal by construction
]

[tool.ruff.lint.isort]
known-first-party = ["drought"]
