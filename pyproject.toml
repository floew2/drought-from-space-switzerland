[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drought-from-space"
version = "2.0.1"
description = "Reading the 2026 Swiss grassland drought from Sentinel-2 and MeteoSwiss station data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabian Löw" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "pillow>=10",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.7",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "requests>=2.31",
    "pydantic>=2.6",
]

[project.scripts]
drought = "drought.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7",
       "types-PyYAML", "types-requests"]
notebook = ["jupyterlab>=4", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Errors and likely bugs. Style beyond that is not enforced on code that was
# written as an analysis and is being refactored module by module.
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # long lines: string-heavy figure code, wrapped by hand
    "E701",   # `if x: y` on one line, used deliberately in figure code
    "E702",   # `a; b` on one line, same
    "B905",   # zip() without strict= — the iterables are equal by construction
]

[tool.ruff.lint.isort]
known-first-party = ["drought"]

[tool.mypy]
python_version = "3.11"
files = ["src/drought"]
ignore_missing_imports = true      # rasterio, geopandas, shapely, pyproj ship no stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["drought"]
omit = ["src/drought/synthetic/*", "src/drought/demo.py", "src/drought/notebook.py"]
